name: Flutter tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create CI environment file
        env:
          API_URL: ${{ secrets.API_URL }}
        run: |
          if [ -z "$API_URL" ]; then
            echo "::error::Falta el Repository secret API_URL."
            exit 1
          fi
          printf 'API_URL=%s\n' "$API_URL" > .env

      - name: Install dependencies
        run: flutter pub get

      - name: Run automated tests
        env:
          API_URL: ${{ secrets.API_URL }}
        run: flutter test --concurrency=1 --reporter expanded

      - name: Run analyzer
        run: flutter analyze
        continue-on-error: true
